services:
  - type: web
    name: barbearia-agendamento
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: barbearia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NOME
        value: evandro
      - key: ADMIN_SENHA
        sync: false

databases:
  - name: barbearia-db
    plan: free
